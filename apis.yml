name: Finmark
description: 'Finmark was a financial planning, modeling, and forecasting SaaS platform for startups and
  small businesses, backed by Bessemer Venture Partners, letting founders build budgets, cash-flow
  runway, hiring plans, and scenario models without spreadsheets. It was acquired by BILL (bill.com) and
  wound down as a standalone product: as of this enrichment pass finmark.com and www.finmark.com return
  a 301 permanent redirect to https://www.bill.com/. There is no longer an independent Finmark developer
  portal, API, documentation, pricing, or status page to enrich; the domain-security probe below reflects
  the residual finmark.com DNS/TLS surface only.'
